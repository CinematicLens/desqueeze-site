<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111f" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0.22"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 34px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; fill: #e6f7fb; letter-spacing: -0.02em; }
      .subtitle { font: 650 18px/1.25 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; fill: rgba(230,247,251,0.88); }
      .boxLabel { font: 700 20px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; fill: #eafcff; letter-spacing: -0.01em; }
      .boxSub { font: 600 14px/1.25 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; fill: rgba(234,252,255,0.78); }
      .badgeText { font: 800 20px/1.1 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; fill: #06111a; letter-spacing: -0.01em; }
      .muted { fill: rgba(230,247,251,0.7); font: 600 14px/1.25 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    </style>
  </defs>

  <!-- Background photo -->
  <image href="/assets/virtual-monitor-hdmi-setup.png" x="0" y="0" width="1200" height="675" preserveAspectRatio="xMidYMid slice"/>

  <!-- Dark overlay -->
  <rect x="0" y="0" width="1200" height="675" fill="url(#overlay)"/>

  <!-- Header -->
  <g filter="url(#softShadow)">
    <text x="60" y="90" class="title">Cinema Monitor (Android)</text>
    <text x="60" y="128" class="subtitle">How to go from Camera &#8594; USB/UVC &#8594; Android &#8594; Live anamorphic monitor</text>
  </g>

  <!-- Step boxes -->
  <g filter="url(#softShadow)">
    <!-- Camera -->
    <rect x="60" y="240" rx="16" ry="16" width="250" height="120" fill="rgba(8, 180, 213, 0.14)" stroke="rgba(34, 211, 238, 0.9)" stroke-width="2"/>
    <text x="92" y="295" class="boxLabel">Camera</text>
    <text x="92" y="328" class="boxSub">(HDMI out)</text>

    <!-- USB/UVC -->
    <rect x="410" y="240" rx="16" ry="16" width="255" height="120" fill="rgba(8, 180, 213, 0.14)" stroke="rgba(34, 211, 238, 0.9)" stroke-width="2"/>
    <text x="442" y="295" class="boxLabel">USB / UVC</text>
    <text x="492" y="328" class="boxSub" text-anchor="middle">capture</text>

    <!-- Android -->
    <rect x="770" y="240" rx="16" ry="16" width="370" height="120" fill="rgba(8, 180, 213, 0.14)" stroke="rgba(34, 211, 238, 0.9)" stroke-width="2"/>
    <text x="845" y="295" class="boxLabel">Android phone/tablet</text>
    <text x="845" y="328" class="boxSub">runs Cinema Monitor</text>

    <!-- Live monitor -->
    <rect x="60" y="395" rx="16" ry="16" width="1080" height="110" fill="rgba(255,255,255,0.08)" stroke="rgba(148, 163, 184, 0.55)" stroke-width="2"/>
    <text x="90" y="450" class="boxLabel">Live anamorphic monitor</text>
    <text x="90" y="480" class="boxSub">de-squeeze + framelines + zebra/false color/focus peaking</text>
  </g>

  <!-- Arrows -->
  <g stroke="#22d3ee" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 300 C 360 300, 360 300, 410 300" marker-end="url(#arrowHead)"/>
    <path d="M665 300 C 715 300, 715 300, 770 300" marker-end="url(#arrowHead)"/>
    <path d="M955 360 C 955 372, 955 372, 620 395" marker-end="url(#arrowHead)" opacity="0.95"/>
  </g>

  <!-- Save-cost badge -->
  <g filter="url(#softShadow)">
    <rect x="70" y="560" rx="22" ry="22" width="1060" height="65" fill="#22d3ee" opacity="0.95"/>
    <text x="600" y="603" text-anchor="middle" class="badgeText">Save cost: use your phone as the relay monitor</text>
    <text x="600" y="624" text-anchor="middle" class="muted">No expensive standalone monitor needed for client/focus checks</text>
  </g>
</svg>

