name: Deploy static HTML to GitHub Pages

# Must live on default branch (main). Builds and deploys the static-html branch.
on:
  push:
    branches:
      - static-html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static-html
        uses: actions/checkout@v4
        with:
          ref: static-html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build CSS
        run: |
          npm ci
          npm run build:css

      - name: Assemble site folder
        run: |
          mkdir _site
          shopt -s dotglob nullglob
          for f in *; do
            case "$f" in
              node_modules|_site|.git) ;;
              *) cp -a "$f" _site/ ;;
            esac
          done
          test -f _site/index.html
          test -f _site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
