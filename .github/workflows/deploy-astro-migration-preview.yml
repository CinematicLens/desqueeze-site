name: Preview deploy (astro-migration)

# Builds astro-migration and publishes to gh-pages/astro-preview/
# Preview URL: https://cinematiclens.github.io/desqueeze-site/astro-preview/
# Production (anamorphic-desqueeze.com) deploys from main only.

on:
  push:
    branches:
      - astro-migration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview-astro-migration
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout astro-migration
        uses: actions/checkout@v4
        with:
          ref: astro-migration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure preview base path
        run: |
          sed -i "s|site: 'https://anamorphic-desqueeze.com'|site: 'https://cinematiclens.github.io', base: '/desqueeze-site/astro-preview/',|" astro.config.mjs

      - name: Build with Astro
        run: npm run build

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: astro-preview
          keep_files: true
